plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name "Nucleoid"
        url 'https://maven.nucleoid.xyz'
    }
    maven {
        name "Jitpack"
        url 'https://jitpack.io'
    }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation fabricApi.module("fabric-command-api-v2", project.fabric_api_version)
    implementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_api_version)

    implementation 'com.github.P03W:Microconfig:2.2.1'
    include 'com.github.P03W:Microconfig:2.2.1'

    implementation "eu.pb4:placeholder-api:3.0.0+26.1"
    include "eu.pb4:placeholder-api:3.0.0+26.1"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

jar {
    from "LICENSE"
}
